name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (Debug)
        run: swift build
      - name: Run Tests
        run: swift test
      - name: Build (Release)
        run: swift build -c release
      - name: Smoke Test CLI
        run: |
          .build/release/kh --version
          .build/release/kh --help
      - name: Shell Script Syntax Check
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
